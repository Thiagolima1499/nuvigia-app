# coturn para o ao vivo remoto do Nuvigia (numa VM pequena na nuvem, com IP público).
# Senhas temporárias geradas pela função turn-credentials do Supabase (mesmo segredo).
listening-port=3478
tls-listening-port=5349
fingerprint
use-auth-secret
# igual a `supabase secrets set TURN_SECRET=...`
static-auth-secret=TROQUE-ESTE-SEGREDO
realm=turn.seu-dominio.com.br
# certificados (Let's Encrypt) para TURN sobre TLS em redes que bloqueiam UDP
cert=/etc/letsencrypt/live/turn.seu-dominio.com.br/fullchain.pem
pkey=/etc/letsencrypt/live/turn.seu-dominio.com.br/privkey.pem
# portas de mídia (liberar no firewall da VM)
min-port=49152
max-port=65535
# segurança: não deixar o TURN alcançar redes privadas da VM
no-multicast-peers
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
no-cli
